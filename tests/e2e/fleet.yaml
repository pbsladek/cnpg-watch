apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-watch-e2e-other
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: inventory
  namespace: cnpg-watch-e2e-other
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      shared_buffers: 32MB
      max_connections: '30'
  managed:
    roles:
      - name: watch_monitor
        ensure: present
        login: true
        superuser: false
        inRoles:
          - pg_monitor
        passwordSecret:
          name: cnpg-watch-monitor
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: payments-pool
  namespace: cnpg-watch-e2e
spec:
  cluster:
    name: payments
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
  template:
    spec:
      containers:
        - name: pgbouncer
          image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
