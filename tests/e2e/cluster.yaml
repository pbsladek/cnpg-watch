apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-watch-e2e
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: payments
  namespace: cnpg-watch-e2e
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      shared_buffers: 32MB
      max_connections: '30'
  managed:
    roles:
      - name: watch_monitor
        ensure: present
        login: true
        superuser: false
        inRoles:
          - pg_monitor
        passwordSecret:
          name: cnpg-watch-monitor
