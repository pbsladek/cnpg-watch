name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fast:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      INSTA_UPDATE: 'no'
      INSTA_FORCE_PASS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy,rustfmt
      - run: make check
      - run: make test
